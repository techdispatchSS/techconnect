# Label set for TechConnect. Apply with .github/scripts/setup-labels.sh
# (run locally where `gh` is authenticated against your own GitHub account —
# this sandbox's proxy can't create these for you.)

- name: "type: story"
  color: "0E8A16"
  description: "User-facing functionality"
- name: "type: bug"
  color: "D73A4A"
  description: "Something broken"
- name: "type: task"
  color: "1D76DB"
  description: "Technical/infra/admin work"

- name: "phase: 1-mvp"
  color: "5319E7"
  description: "Phase 1 MVP scope"
- name: "phase: 2"
  color: "8B5CF6"
  description: "Phase 2 future enhancement"
- name: "phase: 3"
  color: "C4B5FD"
  description: "Phase 3 future enhancement"

- name: "status: backlog"
  color: "EDEDED"
  description: "Not yet scheduled into a sprint"
- name: "status: in-progress"
  color: "FBCA04"
  description: "Actively being worked"
- name: "status: in-review"
  color: "FEF2C0"
  description: "PR open / awaiting review"
- name: "status: blocked"
  color: "B60205"
  description: "Blocked on a decision, dependency, or external party"
- name: "status: done"
  color: "0E8A16"
  description: "Merged and verified"

- name: "priority: critical"
  color: "B60205"
  description: "Blocks the current sprint goal or a client demo"
- name: "priority: high"
  color: "D93F0B"
- name: "priority: medium"
  color: "FBCA04"
- name: "priority: low"
  color: "C2E0C6"

- name: "area: backend"
  color: "1D76DB"
- name: "area: frontend"
  color: "5319E7"
- name: "area: freshdesk-integration"
  color: "006B75"
- name: "area: aws-infra"
  color: "F9A825"
- name: "area: client-facing"
  color: "0E8A16"
  description: "Requires client input/sign-off, not pure dev work"
