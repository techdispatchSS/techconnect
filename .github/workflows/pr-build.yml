name: PR Build Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build
        # -DskipTests still compiles test sources (catching broken test code) without
        # running them — the integration suite needs Testcontainers/Docker and belongs in
        # its own job, not gating whether the app builds. `chmod` guards against the repo
        # being developed on Windows, where mvnw's executable bit doesn't survive a commit.
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests clean package

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production
