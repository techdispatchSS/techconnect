# Active by default (see spring.profiles.default in application.properties) — no flag needed
# for local dev. Local-only conveniences that would be wrong in a real deployment: Mailpit
# accepts unauthenticated, unencrypted SMTP (accessing a real mail provider this way would
# either fail outright or, worse, silently send plaintext credentials), and the API docs are
# worth having open while building against this API locally.
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
