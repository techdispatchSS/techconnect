# Activate with SPRING_PROFILES_ACTIVE=prod.
#
# Disables springdoc entirely rather than relying on the SecurityConfig permitAll rules to
# keep it out of reach: with these set to false, springdoc's own auto-configuration does not
# register the endpoints at all, so /swagger-ui/** and /v3/api-docs/** 404 instead of merely
# being access-controlled. Without this, the full API surface (every endpoint, every DTO
# shape) is fetchable pre-auth in any deployed environment.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# AWS SES (or any real mail provider) requires authenticated, encrypted SMTP — unlike local
# Mailpit. The credentials themselves come from MAIL_USERNAME/MAIL_PASSWORD (an ECS Express
# Mode env var sourced from SSM Parameter Store at deploy time); nothing sensitive is committed
# here, only the flags saying auth/TLS are required.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Notification delivery is intentionally best-effort (see SmtpNotificationService) — a Manager
# onboarding a user must still succeed when the mail relay is unreachable. Actuator's default
# mail health indicator actively probes SMTP connectivity and would otherwise report this
# service DOWN (failing the ALB target group health check and blocking deployment) whenever
# SES/SMTP isn't reachable, even though the app itself is working fine.
management.health.mail.enabled=false
