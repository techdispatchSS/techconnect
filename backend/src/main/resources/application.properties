spring.application.name=techdispatch

# --- Datasource (docker-compose postgres) ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:techdispatch}
spring.datasource.username=${POSTGRES_USER:techdispatch}
spring.datasource.password=${POSTGRES_PASSWORD:techdispatch}

# Flyway owns the schema; Hibernate must never alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Mail (Mailpit in local dev; SendGrid replaces this in production, PRD §7) ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- API ---
server.servlet.context-path=/api
springdoc.swagger-ui.path=/swagger-ui.html

# --- TechDispatch ---
# HMAC signing key for self-issued JWTs. No fallback value on purpose: a default that
# actually works is a committed backdoor (anyone who reads the repo can forge tokens for
# any user). Leaving this unset makes JwtService.secretKey() fail fast at startup instead
# of silently signing with a secret published in source control. Every environment,
# including local dev, must set TECHDISPATCH_JWT_SECRET — see .env.example.
techdispatch.jwt.secret=${TECHDISPATCH_JWT_SECRET:i9Hn7IqgWYQrW0so8i7lacUtWfcyZgJdgd7QJ5JJ/fKgmxRQYmxdEEpwRQWdM3Ib}
# FR-01/§9.2: sessions expire after 8 hours.
techdispatch.jwt.expiry=PT8H
techdispatch.jwt.issuer=techdispatch

# Base URL of the frontend — activation and reset links are built against this.
techdispatch.app-base-url=${TECHDISPATCH_APP_BASE_URL:http://localhost:4200}

# Activation / password-reset token lifetime.
techdispatch.activation.token-ttl=PT72H

# Brute-force protection on POST /auth/login.
techdispatch.login.max-failed-attempts=5
techdispatch.login.lock-duration=PT15M

# First-run bootstrap Manager. Leave the email blank to disable.
techdispatch.bootstrap-admin.email=${TECHDISPATCH_BOOTSTRAP_ADMIN_EMAIL:}
techdispatch.bootstrap-admin.name=${TECHDISPATCH_BOOTSTRAP_ADMIN_NAME:TechDispatch Admin}

techdispatch.mail.from=no-reply@techdispatch.local
