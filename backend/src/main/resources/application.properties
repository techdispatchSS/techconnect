spring.application.name=techconnect

# No profile flag needed for local dev — see application-dev.properties. Set
# SPRING_PROFILES_ACTIVE=prod for a real deployment (see application-prod.properties).
spring.profiles.default=dev

# --- Datasource (docker-compose postgres) ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:techconnect}
spring.datasource.username=${POSTGRES_USER:techconnect}
spring.datasource.password=${POSTGRES_PASSWORD:techconnect}

# Flyway owns the schema; Hibernate must never alter it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Mail (Mailpit in local dev; AWS SES in production, over the same SMTP interface —
# see application-dev.properties / application-prod.properties for the auth/TLS split) ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Database optimisations
spring.jpa.open-in-view=false
spring.datasource.hikari.auto-commit=false
# --- API ---
server.servlet.context-path=/api
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator ---
# /actuator/health stays permitAll (see SecurityConfig) so the ALB target group check needs no
# credentials — that check only reads the HTTP status code, never the body. Component detail
# (db, diskSpace, mail) is still worth protecting: it reveals internal infrastructure state to
# anyone who can reach the port. "when-authorized" resolves both — a bare status for anonymous
# callers, full component breakdown for a request carrying a valid Manager bearer token.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=MANAGER

# --- TechConnect ---
# HMAC signing key for self-issued JWTs. No fallback value on purpose: a default that
# actually works is a committed backdoor (anyone who reads the repo can forge tokens for
# any user). Leaving this unset makes JwtService.secretKey() fail fast at startup instead
# of silently signing with a secret published in source control. Every environment,
# including local dev, must set TECHCONNECT_JWT_SECRET — see .env.example.
techconnect.jwt.secret=${TECHCONNECT_JWT_SECRET:}
# FR-01/§9.2: sessions expire after 8 hours.
techconnect.jwt.expiry=PT8H
techconnect.jwt.issuer=techconnect

# Base URL of the frontend — activation and reset links are built against this.
techconnect.app-base-url=${TECHCONNECT_APP_BASE_URL:http://localhost:4200}

# Activation / password-reset token lifetime.
techconnect.activation.token-ttl=PT72H

# Brute-force protection on POST /auth/login.
techconnect.login.max-failed-attempts=5
techconnect.login.lock-duration=PT15M

# First-run bootstrap Manager. Leave the email blank to disable.
techconnect.bootstrap-admin.email=${TECHCONNECT_BOOTSTRAP_ADMIN_EMAIL:}
techconnect.bootstrap-admin.name=${TECHCONNECT_BOOTSTRAP_ADMIN_NAME:TechConnect Admin}

techconnect.mail.from=${TECHCONNECT_MAIL_FROM:no-reply@tech-connect.app}
# Shown as the sender's name, and where replies go (blank = omit).
techconnect.mail.from-name=${TECHCONNECT_MAIL_FROM_NAME:TechConnect}
techconnect.mail.reply-to=${TECHCONNECT_MAIL_REPLY_TO:support@tech-connect.app}

# Phase 2 (photo/document storage, PRD §7) AWS wiring — S3Client only for now (#4). Blank
# endpoint-override here means the SDK's normal endpoint resolution, i.e. real AWS; the dev
# profile below points it at LocalStack instead, and Docker's own LocalStack container reaches
# these same defaults via docker-compose.yml/.env.example.
techconnect.aws.region=${AWS_REGION:us-east-1}
techconnect.aws.endpoint-override=${AWS_ENDPOINT_OVERRIDE:}
techconnect.aws.documents-bucket=${AWS_DOCUMENTS_BUCKET:techconnect-local}

# --- Security ---
# Number of trusted reverse proxies in front of the app (0 = none; client IP is the socket peer).
# Set to 1 behind the ALB or the docker-compose nginx so rate limiting keys on the real client
# instead of on the proxy — and so a forged X-Forwarded-For can't be used to dodge it.
techconnect.security.trusted-proxy-hops=${TECHCONNECT_TRUSTED_PROXY_HOPS:0}

# --- Technician applications (public, unauthenticated, accepts file uploads) ---
techconnect.applications.max-files=10
techconnect.applications.max-file-size=10MB
techconnect.applications.max-request-size=32MB
# Per client IP, and across everyone, per rolling hour. Bounds both abuse and storage cost.
techconnect.applications.per-ip-per-hour=5
techconnect.applications.global-per-hour=200

# Multipart parsing happens before any controller code runs, so these are the first line of
# defence: Spring/Tomcat refuse anything bigger without buffering it. The part count has to
# cover the JSON part plus every file (Tomcat's default of 10 would reject a full submission).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=32MB
spring.servlet.multipart.file-size-threshold=1MB
server.tomcat.max-part-count=12

# --- Background jobs ---
# Dispatch expiry sweep and Freshdesk poll. The tests turn this off and drive the services directly.
techconnect.scheduling.enabled=true
techconnect.dispatch.expiry-sweep-interval=PT15S
techconnect.freshdesk.poll-interval=PT30S

# --- Simulation (demos and user testing only) ---
# Stand-ins for parties that aren't connected yet: a simulated Freshdesk that raises tickets on
# demand, and a "respond as technician" control. OFF by default and off in production: it makes up
# incidents. Enable per environment with TECHCONNECT_SIMULATION_ENABLED=true (see the dev profile).
techconnect.simulation.enabled=${TECHCONNECT_SIMULATION_ENABLED:false}
