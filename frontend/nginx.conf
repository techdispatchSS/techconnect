server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline browser hardening. Declared at server level (not inside a location) on purpose:
    # nginx drops inherited add_header lines the moment a location declares any of its own.
    # `always` so they also ride on error responses. The CSP is deliberately limited to the
    # directives that can't break the app (no script/style/img source lists, which Google Maps,
    # fonts and map tiles would trip over) - it stops framing, plugins and base-tag hijacking.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

    location /api/ {
        # Must be at least the backend's multipart ceiling (spring.servlet.multipart.max-request-
        # size, 32MB) or technician applications with proof attached are refused here with a 413
        # before the app ever sees them. nginx's own default is 1MB.
        client_max_body_size 32m;
        # A slow upload is how a handful of connections can tie up a worker; give up on a client
        # that stops sending.
        client_body_timeout 30s;

        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITES rather than appends ($proxy_add_x_forwarded_for): this nginx is the first
        # hop facing the client, so anything the client put in X-Forwarded-For is untrusted and
        # must not reach the backend, whose rate limiting keys on the address in this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
