<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" class="admin-btn admin-btn-secondary" mat-dialog-close>Cancel</button>
  <button
    type="button"
    class="admin-btn"
    [class.admin-btn-primary]="!data.destructive"
    [class.admin-btn-secondary]="data.destructive"
    [class.admin-btn-danger]="data.destructive"
    [mat-dialog-close]="true"
  >
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
