<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" mat-dialog-close>Cancel</button>
  <button
    matButton="filled"
    type="button"
    [mat-dialog-close]="true"
    [class.confirm-destructive]="data.destructive"
  >
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
