<!-- The mark's artwork, shared by both variants. A fixed viewBox of 0 40 590 520. -->
<ng-template #shape>
  <svg:g>
    <svg:defs>
      <svg:mask [attr.id]="maskId" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="600">
        <svg:rect x="0" y="0" width="600" height="600" fill="#fff" />
        @for (hole of maskHoles; track $index) {
          <svg:circle [attr.cx]="hole[0]" [attr.cy]="hole[1]" [attr.r]="hole[2]" fill="#000" />
        }
      </svg:mask>
    </svg:defs>

    <svg:g [attr.mask]="maskRef">
      <svg:path
        d="M141.6 191.25 A217.5 217.5 0 1 1 163.4 439.8"
        fill="none"
        stroke="#EE7611"
        stroke-width="65"
      />
      <svg:g
        stroke="#EE7611"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      >
        @for (link of links; track $index) {
          <svg:line
            [attr.x1]="link[0]"
            [attr.y1]="link[1]"
            [attr.x2]="link[2]"
            [attr.y2]="link[3]"
          />
        }
        @for (points of traces; track points) {
          <svg:polyline [attr.points]="points" />
        }
      </svg:g>
    </svg:g>

    <svg:g stroke="#EE7611" fill="none">
      @for (ring of nodeRings; track $index) {
        <svg:circle
          [attr.cx]="ring[0]"
          [attr.cy]="ring[1]"
          [attr.r]="ring[2]"
          [attr.stroke-width]="ring[3]"
        />
      }
    </svg:g>

    <svg:circle cx="153" cy="242" r="13" fill="#EE7611" />
    <svg:rect class="logo-ink" x="225" y="175" width="210" height="58" />
    <svg:rect class="logo-ink" x="301" y="175" width="58" height="195" />
    <svg:circle class="logo-ink-ring" cx="330" cy="402" r="29" />
  </svg:g>
</ng-template>

@if (variant() === 'lockup') {
  <svg viewBox="0 0 1902 560" focusable="false" aria-hidden="true">
    <svg x="0" y="20" width="590" height="520" viewBox="0 40 590 520">
      <ng-container *ngTemplateOutlet="shape" />
    </svg>
    <!-- Prettier-ignored on purpose: whitespace between the tspans would render as visible
         spaces in the wordmark ("Tech - Connect"). -->
    <!-- prettier-ignore -->
    <text x="640" y="355" font-family="Barlow, sans-serif" font-weight="700" font-size="210" letter-spacing="-6"><tspan fill="#EE7611">Tech</tspan><tspan class="logo-ink">-</tspan><tspan class="logo-ink">Connect</tspan></text>
  </svg>
} @else {
  <svg viewBox="0 40 590 520" focusable="false" aria-hidden="true">
    <ng-container *ngTemplateOutlet="shape" />
  </svg>
}
