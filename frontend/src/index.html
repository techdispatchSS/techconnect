<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TechConnect</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Admin portal ("Industry" design system) headings/body — loaded globally, alongside
         Roboto above, rather than per-component so the admin feature's lazy bundle does not
         pull in a whole Google Fonts stylesheet at build time. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script>
      // Sets data-theme on <html> before Angular bootstraps and before first paint, so the
      // page never flashes the wrong theme. ThemeService (core/theme/theme.service.ts) reads
      // whatever this leaves behind and takes over from there.
      (function () {
        try {
          var stored = localStorage.getItem('techconnect.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
