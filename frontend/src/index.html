<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TechConnect</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="TechConnect is field service dispatch: controllers log incidents and send the right technician, technicians pick up and complete jobs on the go."
    />
    <link rel="canonical" href="https://tech-connect.app/" />
    <!-- Link previews (WhatsApp, Slack, LinkedIn, iMessage, etc.) read these when a URL is
         shared. Crawlers don't run JavaScript, so this has to be static HTML rather than set by
         the Angular app. Every route shares one canonical URL: the app is behind sign-in, so
         there is no per-page content for a crawler to index. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TechConnect" />
    <meta property="og:title" content="TechConnect: field service dispatch" />
    <meta
      property="og:description"
      content="Log incidents, dispatch the right technician, and track every job from first call to sign-off."
    />
    <meta property="og:url" content="https://tech-connect.app/" />
    <meta property="og:locale" content="en_ZA" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TechConnect: field service dispatch" />
    <meta
      name="twitter:description"
      content="Log incidents, dispatch the right technician, and track every job from first call to sign-off."
    />
    <meta name="theme-color" content="#17181c" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Admin portal ("Industry" design system) headings/body — loaded globally, alongside
         Roboto above, rather than per-component so the admin feature's lazy bundle does not
         pull in a whole Google Fonts stylesheet at build time. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
